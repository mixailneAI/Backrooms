<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>BACKROOMS — терминал</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="stylesheet" href="./ui/terminal.css">
</head>
<body>
<canvas id="bg"></canvas>
<div class="holo-grid" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<header class="top">
  <span class="brand">BACKROOMS</span>
  <span class="count">уровней: <b id="level-count">0</b></span>
</header>
<main id="menu" class="menu">
  <h1 class="glitch">ЗАКУЛИСЬЕ</h1>
  <p class="lead">Ты вышел из реальности не там, где надо. Найди выход. Не дай присутствию накопиться.</p>
  <button id="play-btn" class="holo-btn primary" type="button">ИГРАТЬ</button>
  <button id="settings-btn" class="holo-btn" type="button">НАСТРОЙКИ</button>
  <button id="install-btn" class="holo-btn" type="button">УСТАНОВИТЬ ПРИЛОЖЕНИЕ</button>
  <section class="stats">
    <div class="tile"><b id="stats-unlocked">0</b><span>открыто</span></div>
    <div class="tile"><b id="stats-notes">0</b><span>записок</span></div>
    <div class="tile"><b id="stats-deaths">0</b><span>смертей</span></div>
  </section>
</main>
<section id="level-panel" class="panel" hidden>
  <div class="panel-head"><h2>ВЫБОР УРОВНЯ</h2><button id="level-back" class="holo-btn small" type="button">НАЗАД</button></div>
  <main id="level-grid" class="grid"></main>
  <section id="abyss-card" class="card abyss">
    <span class="card-num">∞</span><h3>Бездна</h3>
    <span class="card-danger">класс ∞</span>
    <p class="card-tags">бесконечность, стихии глубины, без финала</p>
    <span class="card-state">вход из терминала</span>
  </section>
  <button id="enter-btn" class="holo-btn primary" type="button">ВЫБЕРИ УРОВЕНЬ</button>
</section>
<section id="settings-panel" class="panel" hidden>
  <div class="panel-head"><h2>НАСТРОЙКИ</h2><button id="settings-back" class="holo-btn small" type="button">НАЗАД</button></div>
  <label class="row"><span>Чувствительность</span><output id="sens-val">1.00</output></label>
  <input id="sens-range" class="range" type="range" min="1" max="10" step="0.1" value="1">
  <label class="row"><span>Качество</span></label>
  <select id="quality-select" class="select"><option value="low">low</option><option value="medium" selected>medium</option><option value="high">high</option></select>
  <label class="row"><span>Вибрация</span><input id="vibration-check" type="checkbox" checked></label>
  <label class="row"><span>Звук</span><input id="sound-check" type="checkbox" checked></label>
</section>
<button id="update-toast" class="toast" type="button" hidden></button>
<footer class="foot">Не выходи из реальности повторно. Это не сон.</footer>
<script type="module" src="./ui/terminal.js"></script>
</body>
</html>
